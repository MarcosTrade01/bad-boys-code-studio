name: Verificações do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validação estática
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar HTML, CSS, JavaScript e PWA
        run: node scripts/validate-project.mjs

  browser-regression:
    name: Regressão no Chromium
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Instalar Playwright no ambiente temporário (sem alterar dependências do app)
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Executar testes de regressão do editor
        run: npx playwright test
